<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hiner.nyc</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    img {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      object-position: center;
      background: #000;
    }
    #secret {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 80px;
      height: 80px;
      z-index: 999;
      /* completely invisible — no background, no border */
    }
  </style>
</head>
<body>
  <img src="Colorbars.png" alt="">
  <div id="secret"></div>

  <script>
    // Require 2 taps within 600ms to avoid accidental triggers
    let lastTap = 0;
    document.getElementById('secret').addEventListener('touchend', function(e) {
      e.preventDefault();
      const now = Date.now();
      if (now - lastTap < 600) {
        window.location.href = 'rundown-builder.html';
      }
      lastTap = now;
    });
    // Desktop: double-click
    document.getElementById('secret').addEventListener('dblclick', function() {
      window.location.href = 'rundown-builder.html';
    });
  </script>

</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hiner.nyc</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    img {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      object-position: center;
      background: #000;
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <img src="Colorbars.png" alt="" draggable="false">
  <script>
    var lastTap = 0;

    document.addEventListener('touchstart', function(e) {
      var touch = e.touches[0];
      var x = touch.clientX;
      var y = touch.clientY;c
      var w = window.innerWidth;
      var h = window.innerHeight;

      // lower-left zone: left 20% width, bottom 20% height
      if (x < w * 0.20 && y > h * 0.80) {
        var now = Date.now();
        if (now - lastTap < 500) {
          window.location.href = 'rundown-builder.html';
        }
        lastTap = now;
      }
    }, { passive: true });

    // desktop fallback
    document.addEventListener('dblclick', function(e) {
      if (e.clientX < window.innerWidth * 0.20 && e.clientY > window.innerHeight * 0.80) {
        window.location.href = 'rundown-builder.html';
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mark Hiner | News Executive Producer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cal+Sans:wght@700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- ===== FAVICONS / APP ICONS ===== -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

<style>
html,body{margin:0;padding:0}
html{
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  color-scheme:dark;
  background:#000;
}
body{
  font-family:"Jost",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  color:#fff;
  overflow-x:hidden;
}
h1,h2,h3{
  font-family:"Cal Sans","Jost",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif !important;
  font-weight:700;
  letter-spacing:0.01em;
}
a{color:#FFD500;text-decoration:none}
a:hover{text-decoration:underline}

/* HERO */
.hero {
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  padding:2rem;
  position:relative;
  overflow:hidden;
}

/* Background Video */
#heroVideo {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:0;
  opacity:0.35;
}

/* Overlay for dark contrast */
.hero::after {
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.55);
  z-index:1;
}

.hero-content {
  display:flex;
  align-items:flex-start;
  gap:30px;
  width:100%;
  max-width:1000px;
  position:relative;
  z-index:2;
  transform:translateY(40px);
}
.hero img {
  width:150px;
  border-radius:10px;
  box-shadow:0 8px 28px rgba(0,0,0,.9);
}
.hero-text h1 {
  font-size:4.2rem;
  font-weight:700;
  margin:.2rem 0 .4rem;
  text-shadow:0 5px 20px rgba(0,0,0,0.9);
}
.hero-text p {
  font-weight:500;
  font-size:1.3rem;
  line-height:1.55;
  max-width:600px;
  text-shadow:0 4px 14px rgba(0,0,0,0.8);
}

/* CONTACT ROW */
.contact-row {
  display:flex;
  flex-wrap:wrap;
  gap:1.8rem;
  margin-top:3rem;
}
.contact-item {
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  font-size:0.95rem;
  color:#ccc;
}
.icon {
  width:44px;
  height:44px;
  margin-bottom:0.6rem;
}
.icon svg{
  width:44px;
  height:44px;
  display:block;
  fill:none;
  stroke:#FFD500;
  stroke-width:4;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.contact-item a {
  display:flex;
  flex-direction:column;
  align-items:center;
  color:#FFD500;
  text-decoration:none;
}
.contact-item a:hover { text-decoration:underline; }

/* BLACK STRIP */
.profile{
  background:#000;
  height:55px;
  border-top:3px solid #000;
}

/* SECTIONS */
.section{
  display:flex;
  justify-content:center;
  gap:2.5rem;
  padding:5rem 2rem;
  background:url("images/news-deck.png") center/contain fixed no-repeat;
}
.section + .section{margin-top:4rem}

/* LOGOS */
.logo-col{
  display:flex;
  flex-direction:column;
  gap:2rem;
  align-items:center;
  margin-top:1rem;
}
.logo-col img{
  width:110px;
  border-radius:6px;
  box-shadow:0 8px 28px rgba(0,0,0,.85);
}
.logo-col img[alt*="Fox News"]{width:85px}

/* TEXT */
.text-col{max-width:740px;display:flex;flex-direction:column;gap:2rem}
.text-box{
  background:rgba(0,0,0,.6);
  border-left:4px solid #FFD500;
  border-radius:12px;
  padding:2rem;
}
.text-box h2{font-size:1.15rem;color:#FFD500;margin:0 0 .35rem;letter-spacing:.08em}
.text-box h3{font-size:1.6rem;margin:.2rem 0 1rem}
.text-box ul{list-style:none;margin:0;padding:0;line-height:1.65}
.text-box li{margin:.35rem 0}
.text-box li::before{content:"• ";color:#FFD500}
.text-box h3.small-role {
  font-size:0.95rem;
  font-weight:500;
  color:#ddd;
  margin:.2rem 0 .4rem;
}

/* THUMBNAILS */
.thumb-row{
  display:flex;
  gap:1.5rem;
  justify-content:center;
}
.thumb-row img{
  width:45%;
  border-radius:10px;
  box-shadow:0 22px 55px rgba(0,0,0,.9);
}

/* PREVIOUSLY SECTION BG */
.previously {
  position:relative;
  background:url("images/retro-today-ctrl.png") center/cover fixed no-repeat;
}
.previously::after {
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.45);
  z-index:0;
}
.previously > * {
  position:relative;
  z-index:2;
}

/* FOOTER */
.footer{
  background:#000;
  color:#ccc;
  text-align:center;
  padding:1rem 0;
  border-top:3px solid #FFD500;
  display:flex;
  justify-content:center;
}
.footer .contact-row{ justify-content:center; }

/* RESPONSIVE */
@media (max-width:900px){
  .hero-content{flex-direction:column;align-items:center;text-align:center;transform:none;margin-top:2rem}
  .hero img{width:130px}
  .hero-text h1{font-size:2.8rem}
  .hero-text p{font-size:1.05rem}
  .contact-row{justify-content:center;margin-top:1rem}
  .section{flex-direction:column;align-items:center;padding:3.5rem 1.25rem}
  .logo-col{flex-direction:row;justify-content:center}
  .logo-col img{width:95px}
  .thumb-row img{width:48%}
}
</style>
</head>
<body>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lights</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lights">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0d12">
  <meta name="color-scheme" content="dark">

  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='icon.svg') }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>Lights</h1>
    <div class="header-actions">
      <button id="allOnBtn" class="pill-btn">All On</button>
      <button id="allOffBtn" class="pill-btn pill-btn-dim">All Off</button>
      <button id="refreshBtn" class="icon-btn" aria-label="Refresh">⟳</button>
    </div>
  </header>

  <div class="automation-bar">
    <span id="automationLabel">Automation: loading…</span>
    <label class="switch">
      <input type="checkbox" id="automationToggle" disabled>
      <span class="track"></span>
      <span class="thumb"></span>
    </label>
  </div>

  <div id="banner" class="banner" hidden></div>

  <main id="lights" class="lights-grid">
    <p id="emptyState" class="empty-state" hidden>No lights found. Check your Tuya setup in README.md.</p>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
